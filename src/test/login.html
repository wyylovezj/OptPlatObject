<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信维通 - 运维一体化平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --primary-light: #e8f0fe;
      --accent: #00c9a7;
      --bg-dark: #0f1923;
      --bg-card: rgba(255,255,255,0.04);
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: rgba(255,255,255,0.08);
      --input-bg: rgba(255,255,255,0.06);
      --shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Left Panel: Branding ── */
    .brand-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: linear-gradient(135deg, #0f1923 0%, #162a3e 50%, #0f1923 100%);
      overflow: hidden;
    }

    .brand-panel::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(26,115,232,0.12) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: float 20s ease-in-out infinite;
    }

    .brand-panel::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,201,167,0.08) 0%, transparent 70%);
      bottom: -150px; right: -100px;
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Grid pattern overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .brand-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
    }

    .logo-icon {
      width: 88px; height: 88px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(26,115,232,0.3);
      position: relative;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      z-index: -1;
      opacity: 0.3;
      filter: blur(8px);
    }

    .logo-icon svg {
      width: 48px; height: 48px;
      fill: white;
    }

    .brand-title {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #a8c7fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .brand-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .brand-features {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .feature-item:hover {
      border-color: rgba(26,115,232,0.3);
      background: rgba(26,115,232,0.06);
      transform: translateX(4px);
    }

    .feature-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }

    .feature-icon.blue { background: rgba(26,115,232,0.15); }
    .feature-icon.green { background: rgba(0,201,167,0.15); }
    .feature-icon.orange { background: rgba(255,165,0,0.15); }

    .feature-text {
      text-align: left;
    }

    .feature-text h4 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .feature-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Right Panel: Login ── */
    .login-panel {
      width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: linear-gradient(180deg, #141e2b 0%, #0f1923 100%);
      border-left: 1px solid var(--border);
      position: relative;
    }

    .login-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 100%;
      background: linear-gradient(180deg, transparent, rgba(26,115,232,0.3), transparent);
    }

    .login-box {
      width: 100%;
      max-width: 380px;
    }

    .login-header {
      margin-bottom: 40px;
    }

    .login-header h2 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Form */
    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .form-input::placeholder {
      color: #5f6368;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: rgba(26,115,232,0.06);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
    }

    .form-input:focus + .icon,
    .form-input:focus ~ .icon {
      color: var(--primary);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: var(--text);
    }

    .password-toggle svg {
      width: 18px; height: 18px;
    }

    /* Options row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
    }

    .remember-me input[type="checkbox"] {
      display: none;
    }

    .checkmark {
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .checkmark svg {
      width: 12px; height: 12px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s;
      fill: white;
    }

    .remember-me input:checked + .checkmark {
      background: var(--primary);
      border-color: var(--primary);
    }

    .remember-me input:checked + .checkmark svg {
      opacity: 1;
      transform: scale(1);
    }

    .forgot-link {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.8;
    }

    /* Submit */
    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary) 0%, #4285f4 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(26,115,232,0.35);
    }

    .login-btn:hover::before {
      opacity: 1;
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.85;
    }

    .login-btn .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      gap: 16px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* SSO */
    .sso-options {
      display: flex;
      gap: 12px;
    }

    .sso-btn {
      flex: 1;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sso-btn:hover {
      border-color: rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .sso-btn svg {
      width: 16px; height: 16px;
    }

    /* Footer */
    .login-footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: #5f6368;
    }

    /* ── Particles ── */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(26,115,232,0.4);
      border-radius: 50%;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .brand-panel { display: none; }
      body { justify-content: center; }
      .login-panel {
        width: 100%;
        max-width: 480px;
        border-left: none;
      }
      .login-panel::before { display: none; }
    }

    @media (max-width: 480px) {
      .login-panel { padding: 24px; }
      .login-box { max-width: 100%; }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 14px 20px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      transform: translateX(120%);
      transition: transform 0.3s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .toast.show { transform: translateX(0); }
    .toast.error { border-color: rgba(239,68,68,0.3); }
    .toast.success { border-color: rgba(0,201,167,0.3); }
  </style>
</head>
<body>

  <!-- Left: Branding -->
  <div class="brand-panel">
    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="brand-content">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l7 3.5v7.64l-7 3.5-7-3.5V7.68l7-3.5zM12 8a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg>
      </div>
      <h1 class="brand-title">信维通</h1>
      <p class="brand-subtitle">运维一体化平台</p>

      <div class="brand-features">
        <div class="feature-item">
          <div class="feature-icon blue">🛡️</div>
          <div class="feature-text">
            <h4>统一监控</h4>
            <p>全栈可观测，实时掌握系统健康状态</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon green">⚡</div>
          <div class="feature-text">
            <h4>智能运维</h4>
            <p>AI 驱动告警分析，故障自愈闭环</p>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon orange">📊</div>
          <div class="feature-text">
            <h4>高效协同</h4>
            <p>工单流转自动化，团队协作无缝衔接</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Login -->
  <div class="login-panel">
    <div class="login-box">
      <div class="login-header">
        <h2>欢迎回来</h2>
        <p>登录信维通运维一体化平台</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <div class="input-wrapper">
            <input type="text" class="form-input" id="username" placeholder="请输入用户名或邮箱" autocomplete="username" required>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password" required>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="显示密码">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span class="checkmark">
              <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            </span>
            记住我
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">登 录</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="divider">
        <span>其他登录方式</span>
      </div>

      <div class="sso-options">
        <button class="sso-btn" onclick="handleSSO('ldap')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M2 12h20M12 2a15 15 0 014 10 15 15 0 01-4 10 15 15 0 01-4-10A15 15 0 0112 2z"/></svg>
          LDAP
        </button>
        <button class="sso-btn" onclick="handleSSO('dingtalk')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.2-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          钉钉
        </button>
        <button class="sso-btn" onclick="handleSSO('wechat')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.69 2C4.45 2 1 4.97 1 8.65c0 2.16 1.13 4.09 2.88 5.44l-.72 2.16 2.52-1.26c.78.22 1.6.36 2.46.39a6.6 6.6 0 01-.23-1.74c0-3.79 3.43-6.87 7.09-6.87.34 0 .67.03 1 .07C15.33 3.87 12.29 2 8.69 2zm-2.87 4a.6.6 0 110-1.2.6.6 0 010 1.2zm5.74 0a.6.6 0 110-1.2.6.6 0 010 1.2z"/><path d="M23 12.82c0-3.22-3.06-5.84-6.83-5.84s-6.83 2.62-6.83 5.84 3.06 5.84 6.83 5.84c.76 0 1.49-.11 2.17-.31l1.93.97-.55-1.65c1.48-1.14 2.28-2.72 2.28-4.85zm-9.2-.82a.54.54 0 110-1.08.54.54 0 010 1.08zm4.74 0a.54.54 0 110-1.08.54.54 0 010 1.08z"/></svg>
          微信
        </button>
      </div>

      <div class="login-footer">
        <p>© 2026 信维通 · 运维一体化平台</p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ── Particles ──
    (function initParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (15 + Math.random() * 20) + 's';
        p.style.animationDelay = Math.random() * 15 + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(p);
      }
    })();

    // ── Password Toggle ──
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    // ── Toast ──
    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      const icons = { error: '❌', success: '✅', info: 'ℹ️' };
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${icons[type] || ''}</span> ${message}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ── Login Handler ──
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showToast('请填写用户名和密码');
        return;
      }

      btn.classList.add('loading');

      // Simulate API call
      setTimeout(() => {
        btn.classList.remove('loading');
        showToast('登录成功，正在跳转...', 'success');
      }, 1500);

      // Real implementation:
      // try {
      //   const res = await fetch('/api/auth/login', {
